name: Secret scan

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.21.2 (checksum pinned)
        run: |
          curl -sSL -o gl.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gl.tar.gz" | sha256sum -c -
          tar xzf gl.tar.gz gitleaks

      # Report-only: findings are logged (redacted) but never fail the check.
      - name: Scan for secrets (redacted output, report-only)
        run: ./gitleaks git . --redact --no-banner --verbose --exit-code 0
